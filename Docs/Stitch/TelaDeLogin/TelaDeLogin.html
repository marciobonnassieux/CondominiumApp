<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-fixed-variant": "#2d476f",
              "on-tertiary-fixed": "#261900",
              "secondary-fixed-dim": "#b9c7df",
              "tertiary-fixed-dim": "#e9c176",
              "surface": "#f8f9ff",
              "inverse-primary": "#adc7f7",
              "secondary-container": "#d5e3fc",
              "on-error": "#ffffff",
              "surface-container-highest": "#d5e3fd",
              "on-tertiary": "#ffffff",
              "on-primary": "#ffffff",
              "error": "#ba1a1a",
              "primary-container": "#1a365d",
              "outline-variant": "#c4c6cf",
              "on-secondary-container": "#57657a",
              "surface-container-low": "#eff4ff",
              "secondary": "#515f74",
              "outline": "#74777f",
              "background": "#f8f9ff",
              "on-tertiary-fixed-variant": "#5d4201",
              "error-container": "#ffdad6",
              "on-secondary-fixed-variant": "#3a485b",
              "on-secondary-fixed": "#0d1c2e",
              "on-error-container": "#93000a",
              "on-background": "#0d1c2f",
              "on-surface-variant": "#43474e",
              "inverse-on-surface": "#ebf1ff",
              "on-primary-fixed": "#001b3c",
              "primary-fixed": "#d6e3ff",
              "surface-container": "#e6eeff",
              "surface-tint": "#455f88",
              "on-tertiary-container": "#be9953",
              "tertiary-fixed": "#ffdea5",
              "tertiary": "#2d1e00",
              "surface-variant": "#d5e3fd",
              "surface-container-high": "#dde9ff",
              "surface-container-lowest": "#ffffff",
              "inverse-surface": "#233144",
              "tertiary-container": "#483200",
              "primary": "#002045",
              "on-surface": "#0d1c2f",
              "surface-dim": "#ccdbf4",
              "secondary-fixed": "#d5e3fc",
              "primary-fixed-dim": "#adc7f7",
              "on-secondary": "#ffffff",
              "on-primary-container": "#86a0cd",
              "surface-bright": "#f8f9ff"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-color: #f8f9ff;
            background-image: radial-gradient(#d5e3fd 0.5px, transparent 0.5px), radial-gradient(#d5e3fd 0.5px, #f8f9ff 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-pattern font-body text-on-surface flex items-center justify-center min-h-screen p-6">
<!-- Modal Shell -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_16px_48px_-12px_rgba(13,28,47,0.06)] overflow-hidden transition-all">
<!-- Header / Identity -->
<header class="pt-12 pb-8 px-10 text-center">
<div class="flex flex-col items-center gap-4">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-4xl" data-icon="apartment">apartment</span>
</div>
<h1 class="font-headline text-2xl font-black tracking-[0.2em] text-primary uppercase">Edifácil</h1>
<p class="font-headline text-sm uppercase tracking-widest text-on-surface-variant font-medium">O App do Condomínio</p>
</div>
</header>
<!-- Form Section -->
<section class="px-10 pb-10">
<form class="space-y-6">
<!-- User ID Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-semibold text-on-surface" for="user-id">Email or User ID</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-3.5 bg-surface-container-high text-on-surface border-none rounded-lg focus:ring-2 focus:ring-tertiary-fixed-dim transition-all outline-none placeholder:text-outline-variant font-medium" id="user-id" placeholder="seuemail@condominio.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-semibold text-on-surface" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-3.5 bg-surface-container-high text-on-surface border-none rounded-lg focus:ring-2 focus:ring-tertiary-fixed-dim transition-all outline-none placeholder:text-outline-variant font-medium" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-headline font-bold text-base tracking-widest uppercase shadow-lg shadow-primary/10 hover:bg-primary-container active:scale-[0.98] transition-all duration-300" type="submit">
                        LOGIN
                    </button>
</div>
</form>
<!-- Footer Links -->
<footer class="mt-10 flex flex-col items-center gap-4 border-t border-surface-container-low pt-8">
<a class="text-sm font-medium text-secondary hover:text-primary transition-colors tracking-tight" href="#">Esqueceu a senha?</a>
<div class="flex items-center gap-2">
<span class="text-xs text-on-surface-variant">Novo por aqui?</span>
<a class="text-sm font-bold text-tertiary-fixed-variant hover:text-tertiary-container transition-colors tracking-tight" href="#">Criar conta</a>
</div>
</footer>
</section>
</main>
<!-- Visual Accents -->
<div class="fixed bottom-0 left-0 p-8 hidden md:block">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-tertiary-fixed-dim"></div>
<span class="text-[10px] font-headline font-bold uppercase tracking-[0.3em] text-on-surface-variant opacity-50">Edifácil 2024</span>
</div>
</div>
</body></html>
