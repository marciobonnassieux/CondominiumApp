        body {
            background-color: theme('colors.background');

      min-height: max(884px, 100dvh);

<body class="font-body text-on-background antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Top Navigation (Modified for "Back-to-Main" exception for focused views) -->
<header class="flex items-center bg-surface p-4 pb-2 justify-between z-10 relative shadow-sm">
<div class="flex items-center gap-3 flex-1">
<button class="text-on-surface hover:bg-surface-container rounded-full p-2 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h2 class="text-on-surface text-lg font-headline font-bold leading-tight tracking-[-0.015em]">Registro de Volume</h2>
</div>
<div class="flex items-center justify-end">
<button class="text-primary text-base font-headline font-bold leading-normal tracking-[0.015em] shrink-0 uppercase">Próxima Unidade</button>
</div>
</header>
<!-- Camera Viewport / Scanner -->
<main class="flex-1 relative bg-inverse-surface flex flex-col items-center justify-center overflow-hidden h-[calc(100vh-250px)]">
<!-- Simulated Camera Background -->
<div class="absolute inset-0 bg-center bg-cover bg-no-repeat opacity-60" data-alt="Blurred background of stacked cardboard boxes" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB7wJ9_Ln3FqRVQOVoE5d9COJ9iqvKoStiSUa0oCh9ysy9QDePps42GDE4_FA_QRNxUZlt3J9oZzvUbqu9lX1k4_tm2oHQxA0AzTZMFRSF0gTNzw4OnLzwhQEkxFHKTtdK_V1RdiAv4tLmQ9Y6lk12gfc9N_J4ppEgvLpF_aC_cJr408v2WknMZKZ_hDLevkEQIdtnnvTqBqeSVreTkfbx8Wr3HjzNNgCoDuq13dd65WCoHsk-3IfYXYcORaSas_8FIxc51TuJNoK9q');"></div>
<!-- Scanner Overlay -->
<div class="relative z-10 w-64 h-64 border-2 border-dashed border-on-tertiary-container rounded-lg flex items-center justify-center">
<div class="absolute w-8 h-8 border-t-4 border-l-4 border-on-tertiary-container top-[-4px] left-[-4px] rounded-tl-lg"></div>
<div class="absolute w-8 h-8 border-t-4 border-r-4 border-on-tertiary-container top-[-4px] right-[-4px] rounded-tr-lg"></div>
<div class="absolute w-8 h-8 border-b-4 border-l-4 border-on-tertiary-container bottom-[-4px] left-[-4px] rounded-bl-lg"></div>
<div class="absolute w-8 h-8 border-b-4 border-r-4 border-on-tertiary-container bottom-[-4px] right-[-4px] rounded-br-lg"></div>
<!-- Scanning Line -->
<div class="w-full h-[2px] bg-on-tertiary-container absolute top-1/2 left-0 opacity-75 shadow-[0_0_10px_2px_rgba(190,153,83,0.5)]"></div>
<p class="text-on-secondary font-label text-sm uppercase tracking-widest mt-32 drop-shadow-md">Alinhe a etiqueta</p>
</div>
<!-- Floating Action Button - Take Photo -->
<button class="absolute bottom-12 z-20 bg-primary text-on-primary rounded-full p-4 shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)] hover:scale-95 transition-transform duration-200 flex items-center justify-center">
<span class="material-symbols-outlined text-3xl" data-icon="photo_camera">photo_camera</span>
</button>
</main>
<!-- Bottom Drawer: Registered Packages -->
<div class="absolute bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-3xl shadow-[0_-16px_48px_rgba(13,28,47,0.06)] flex flex-col z-30 transition-transform duration-300 transform translate-y-0" style="max-height: 50vh;">
<!-- Handle -->
<div class="flex justify-center pt-3 pb-1 cursor-pointer">
<div class="h-1 w-12 rounded-full bg-outline-variant"></div>
</div>
<div class="flex-1 overflow-y-auto pb-6">
<h2 class="text-on-surface text-lg font-headline font-bold leading-tight tracking-[-0.015em] px-5 py-3 text-left">Pacotes Registrados</h2>
<!-- Package List -->
<div class="flex flex-col gap-2 px-4">
<!-- Package Item 1 -->
<div class="flex items-center gap-4 bg-surface-container-low px-4 min-h-[72px] py-3 rounded-xl justify-between border border-surface-container">
<div class="flex items-center gap-4">
<div class="text-on-surface flex items-center justify-center rounded-lg bg-surface-container shrink-0 size-12">
<span class="material-symbols-outlined text-2xl" data-icon="package" data-weight="fill" style="font-variation-settings: 'FILL' 1;">package</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-on-surface font-headline text-base font-bold leading-tight">Volume 123456</p>
<p class="text-on-surface-variant font-body text-sm font-medium leading-normal">Lido com sucesso</p>
</div>
</div>
<div class="shrink-0 text-on-tertiary-container flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-2xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Package Item 2 -->
<div class="flex items-center gap-4 bg-surface-container-low px-4 min-h-[72px] py-3 rounded-xl justify-between border border-surface-container opacity-70">
<div class="flex items-center gap-4">
<div class="text-on-surface flex items-center justify-center rounded-lg bg-surface-container shrink-0 size-12">
<span class="material-symbols-outlined text-2xl" data-icon="package">package</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-on-surface font-headline text-base font-bold leading-tight">Volume 987654</p>
<p class="text-on-surface-variant font-body text-sm font-medium leading-normal">Lido com sucesso</p>
</div>
</div>
<div class="shrink-0 text-on-tertiary-container flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-2xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</div>
</div>
