<!DOCTYPE html><html class="antialiased" lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Recuperação de Senha - Azure Concierge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  tailwind.config = {

    theme: {
      extend: {
        colors: {
          "on-secondary-fixed-variant": "#3a485b",
          "on-secondary-fixed": "#0d1c2e",
          "on-primary-fixed-variant": "#2d476f",
          "surface-bright": "#f8f9ff",
          "inverse-primary": "#adc7f7",
          "on-secondary-container": "#57657a",
          "outline": "#74777f",
          "surface-container-high": "#dde9ff",
          "on-primary": "#ffffff",
          "on-tertiary-fixed": "#261900",
          "surface-container-low": "#eff4ff",
          "primary-fixed-dim": "#adc7f7",
          "secondary-fixed-dim": "#b9c7df",
          "primary-fixed": "#d6e3ff",
          "primary": "#002045",
          "on-error-container": "#93000a",
          "outline-variant": "#c4c6cf",
          "primary-container": "#1a365d",
          "surface-container": "#e6eeff",
          "surface-container-lowest": "#ffffff",
          "on-primary-fixed": "#001b3c",
          "on-tertiary-fixed-variant": "#5d4201",
          "on-tertiary": "#ffffff",
          "on-tertiary-container": "#be9953",
          "error": "#ba1a1a",
          "tertiary-container": "#483200",
          "background": "#f8f9ff",
          "on-surface-variant": "#43474e",
          "on-primary-container": "#86a0cd",
          "on-secondary": "#ffffff",
          "surface-container-highest": "#d5e3fd",
          "tertiary-fixed-dim": "#e9c176",
          "tertiary-fixed": "#ffdea5",
          "secondary-container": "#d5e3fc",

          "secondary-fixed": "#d5e3fc",
          "surface-variant": "#d5e3fd",
          "on-surface": "#0d1c2f",
          "on-background": "#0d1c2f",
          "inverse-surface": "#233144",
          "secondary": "#515f74",
          "surface": "#f8f9ff",
          "surface-tint": "#455f88",
          "surface-dim": "#ccdbf4",
          "on-error": "#ffffff",
          "error-container": "#ffdad6"
        },
        fontFamily: {
          "headline": ["Manrope", "sans-serif"],
          "body": ["Inter", "sans-serif"],
          "label": ["Inter", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
      },

<style>
  body {
    background: linear-gradient(135deg, rgba(214, 227, 255, 0.3) 0%, rgba(248, 249, 255, 1) 40%, rgba(233, 193, 118, 0.05) 100%);
    background-color: #f8f9ff;
  }
  .otp-input::-webkit-outer-spin-button,
  .otp-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .otp-input[type=number] {
    -moz-appearance: textfield;
  }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-surface bg-background min-h-screen flex flex-col items-center justify-center p-4">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg shadow-[rgba(0,0,0,0.1)] overflow-hidden relative">
<!-- Minimal Header for Back-to-Main Exception -->
<div class="flex items-center p-4 pb-0 relative z-10">
<button aria-label="Voltar" class="text-on-surface hover:bg-surface-container-low p-2 rounded-full transition-colors flex items-center justify-center" style="">
<span class="material-symbols-outlined" data-icon="arrow_back" style="">arrow_back</span>
</button>
</div>
<div class="p-8 pt-6 flex flex-col items-center relative z-10">
<!-- Icon or Illustration -->
<div class="w-20 h-20 bg-surface-container rounded-full flex items-center justify-center mb-6 text-primary shadow-sm shadow-[rgba(0,0,0,0.05)]">
<span class="material-symbols-outlined text-4xl" data-icon="lock_open_right" style="font-variation-settings: &quot;FILL&quot; 1;">lock_open_right</span>
</div>
<!-- Headers -->
<h1 class="font-headline text-3xl font-extrabold text-on-surface mb-3 text-center tracking-[-0.025em]" style="">Verificação de Segurança</h1>
<p class="font-body text-base text-on-surface-variant text-center mb-8 max-w-[280px]" style="">
      Enviamos um código de 6 dígitos para o seu email cadastrado.
    </p>
<!-- OTP Input Group -->
<div class="flex justify-center gap-2 sm:gap-3 mb-8 w-full">
<input class="otp-input w-12 h-14 text-center font-headline text-xl font-bold rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all shadow-inner" maxlength="1" placeholder="•" type="number" value="4">
<input class="otp-input w-12 h-14 text-center font-headline text-xl font-bold rounded-lg border border-outline-variant bg-surface-container-low text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all shadow-inner" maxlength="1" placeholder="•" type="number" value="8">
<input autofocus="" class="otp-input w-12 h-14 text-center font-headline text-xl font-bold rounded-lg border border-primary bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all shadow-[0_0_0_2px_rgba(214,227,255,0.5)]" maxlength="1" placeholder="•" type="number">
<input class="otp-input w-12 h-14 text-center font-headline text-xl font-bold rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all" maxlength="1" placeholder="•" type="number">
<input class="otp-input w-12 h-14 text-center font-headline text-xl font-bold rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all" maxlength="1" placeholder="•" type="number">
<input class="otp-input w-12 h-14 text-center font-headline text-xl font-bold rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all" maxlength="1" placeholder="•" type="number">
</div>
<!-- Timer & Resend -->
<div class="flex flex-col items-center gap-4 w-full mb-8">
<div class="flex items-center gap-2 bg-tertiary-fixed-dim/20 px-4 py-2 rounded-full border border-tertiary-fixed-dim/30">
<span class="material-symbols-outlined text-on-tertiary-container text-sm" data-icon="timer" style="">timer</span>
<span class="font-body text-sm font-semibold text-on-tertiary-container uppercase tracking-wide" style="">04:59</span>
</div>
<button class="font-body text-sm font-medium text-outline hover:text-on-surface transition-colors underline-offset-4 hover:underline focus:outline-none" style="">
        Reenviar código
      </button>
</div>
<!-- Primary Action (Implicitly focused/next step) -->
<button class="w-full bg-primary text-on-primary font-headline font-bold text-lg py-4 rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)] hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" style="">
<span class="" style="">VERIFICAR</span>
<span class="material-symbols-outlined" data-icon="arrow_forward" style="">arrow_forward</span>
</button>
</div>
<!-- Decorative Bottom Edge -->
<div class="h-2 w-full bg-primary-fixed mt-auto"></div>
</div>
</body></html>
