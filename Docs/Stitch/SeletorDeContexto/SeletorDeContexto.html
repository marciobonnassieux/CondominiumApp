</div>

<div class="w-full max-w-md space-y-4">

</div>
<div class="flex items-center gap-5 relative z-10">
<div class="w-14 h-14 bg-surface-container-low rounded-xl flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300">

</div>
<div class="text-left">
<h3 class="font-headline font-bold text-lg text-primary leading-tight">Edifício Solar</h3>
<p class="font-label text-xs font-bold tracking-widest text-on-secondary-container uppercase mt-1">Síndico</p>
</div>
</div>
<div class="relative z-10 w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined text-[#C5A059] group-hover:translate-x-1 transition-transform duration-300" data-icon="arrow_forward" style="font-variation-settings: 'wght' 600;">arrow_forward</span>

</button>

<div class="flex items-center gap-5 relative z-10">

<div class="relative z-10 w-10 h-10 flex items-center justify-center">

</button>
