<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background: radial-gradient(at top left, rgba(214, 227, 255, 0.3), transparent),
                        radial-gradient(at top center, rgba(233, 193, 118, 0.05), transparent);
            min-height: 100vh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body text-on-surface bg-background antialiased pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-sm dark:shadow-none">
<div class="flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-blue-900 dark:text-blue-100 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-95 duration-200 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-extrabold tracking-tight text-blue-900 dark:text-blue-100 text-xl">Perfil</h1>
</div>
<div class="text-xl font-extrabold text-blue-900 dark:text-blue-50 tracking-tighter uppercase">Edifácil</div>
</div>
<div class="bg-slate-100/50 dark:bg-slate-800/50 h-[1px]"></div>
</header>
<main class="pt-24 px-6 max-w-lg mx-auto">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center mb-10">
<div class="relative">
<div class="w-32 h-32 rounded-full border-4 border-surface-container-highest overflow-hidden bg-surface-container-low shadow-lg">
<img alt="Foto de Perfil" class="w-full h-full object-cover" data-alt="Close up portrait of a professional man in a bright setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCu_uBKcmRjqzHcNAuMEj_GQz7vdezEsT-ZSQBu6VTQhNVrIIPzWtHBfHT-qy-tiCvJUgYGQVCbdBJxc80Z8cf4UWu03TZNxChHbSTuvaAfi9aOirnoOMwy4XcOJVg1ddBAYJA6sXF3ma90MPwDrd1SNuvs1Kc9XrfOBGhig-5rMOv-HkX7eMGjfTP1Hz81rcGazcK5bCtf0XoznCzNGoDm9g0nQT2N9xqofN5PrP-OqGEarlFwidxObSVpg2BV68bd7By05pEKJkt"/>
</div>
<button class="absolute bottom-0 right-0 bg-tertiary-fixed-dim text-on-tertiary-fixed w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform duration-200 border-2 border-white">
<span class="material-symbols-outlined text-xl" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
<div class="mt-4 text-center">
<p class="text-[10px] font-bold tracking-widest uppercase text-on-secondary-container">O App do Condomínio</p>
<h2 class="font-headline font-extrabold text-2xl text-primary tracking-tight mt-1">Configurar Perfil</h2>
</div>
</section>
<!-- Form Fields Section -->
<div class="space-y-6">
<!-- Bento style container for inputs -->
<div class="grid grid-cols-1 gap-4">
<!-- Nome Completo -->
<div class="group">
<label class="block text-[11px] font-bold tracking-widest uppercase text-on-secondary-container mb-2 ml-1">Nome Completo</label>
<div class="relative flex items-center">
<span class="absolute left-4 material-symbols-outlined text-outline" data-icon="person">person</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-none rounded-xl shadow-sm focus:ring-2 focus:ring-primary text-on-surface font-medium transition-all duration-300" placeholder="Ex: Roberto da Silva" type="text"/>
</div>
</div>
<!-- CPF -->
<div class="group">
<label class="block text-[11px] font-bold tracking-widest uppercase text-on-secondary-container mb-2 ml-1">CPF</label>
<div class="relative flex items-center">
<span class="absolute left-4 material-symbols-outlined text-outline" data-icon="badge">badge</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-none rounded-xl shadow-sm focus:ring-2 focus:ring-primary text-on-surface font-medium transition-all duration-300" placeholder="000.000.000-00" type="text"/>
</div>
</div>
<!-- Telefone -->
<div class="group">
<label class="block text-[11px] font-bold tracking-widest uppercase text-on-secondary-container mb-2 ml-1">Telefone</label>
<div class="relative flex items-center">
<span class="absolute left-4 material-symbols-outlined text-outline" data-icon="call">call</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-none rounded-xl shadow-sm focus:ring-2 focus:ring-primary text-on-surface font-medium transition-all duration-300" placeholder="(11) 99999-9999" type="tel"/>
</div>
</div><div class="group">
<label class="block text-[11px] font-bold tracking-widest uppercase text-on-secondary-container mb-2 ml-1">E-mail Cadastrado</label>
<div class="relative flex items-center">
<span class="absolute left-4 material-symbols-outlined text-outline" data-icon="mail">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-xl shadow-sm focus:ring-0 text-on-secondary-container font-medium transition-all duration-300 cursor-not-allowed" placeholder="usuario@exemplo.com.br" readonly="" type="email" value="usuario@exemplo.com.br"/>
<span class="absolute right-4 material-symbols-outlined text-outline/50 text-sm" data-icon="lock">lock</span>
</div>
</div>
<!-- Cargo Dropdown -->
</div>
<!-- Informational Glass Card -->
<div class="mt-8 p-6 rounded-2xl bg-white/40 backdrop-blur-lg border border-white/60 shadow-sm flex items-start gap-4">
<div class="w-10 h-10 rounded-xl bg-primary/5 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<div>
<h4 class="font-headline font-bold text-primary leading-tight">Segurança de Dados</h4>
<p class="text-sm text-secondary leading-relaxed mt-1">Suas informações são criptografadas e utilizadas apenas para a gestão de acesso do condomínio.</p>
</div>
</div>
</div>
</main>
<!-- Footer Action -->
<div class="fixed bottom-0 w-full p-6 bg-gradient-to-t from-background via-background to-transparent pointer-events-none">
<div class="max-w-lg mx-auto pointer-events-auto">
<button class="w-full h-16 bg-primary text-on-primary font-headline font-extrabold text-sm tracking-widest uppercase rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-3">
                Salvar Alterações
                <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</button>
</div>
</div>
</body></html>
